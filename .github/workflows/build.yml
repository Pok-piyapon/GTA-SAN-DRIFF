name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  # Phase 3 probe app (this repo's own Kotlin project)
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build probe APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: sa-runner-probe-apk
          path: app/build/outputs/apk/debug/*.apk

  # Phase 4 runtime app: upstream Winlator (LGPL-2.1) + the SA Runner overlay in runtime/
  runtime:
    runs-on: ubuntu-latest
    env:
      WINLATOR_APP_REPO: https://github.com/brunodev85/winlator-app.git
      # Pinned upstream commit (Winlator 11.2 app source, 2026-10-16)
      WINLATOR_APP_COMMIT: 8077f374ef2d54127b088de9e8cd7b4af14d9c8b
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch pinned Winlator app source
        run: |
          git init upstream
          cd upstream
          git remote add origin "$WINLATOR_APP_REPO"
          git fetch --depth 1 origin "$WINLATOR_APP_COMMIT"
          git checkout --quiet FETCH_HEAD

      - name: Apply SA Runner overlay
        run: python3 runtime/apply_overlay.py upstream

      # Same signing key on every build, so a new APK installs over the old one
      # without wiping the ~1 GB of installed system files.
      - name: Install fixed debug signing key
        run: |
          mkdir -p ~/.android
          base64 -d runtime/debug.keystore.b64 > ~/.android/debug.keystore

      - name: Build runtime APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: sa-runner-runtime-apk
          path: upstream/app/build/outputs/apk/debug/*.apk
